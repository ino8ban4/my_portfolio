name: E2E CI

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up env file for CI
        working-directory: projects/blog/api
        run: cp .env.ci .env

      - name: Build and start Docker Compose services
        working-directory: projects/blog
        run: docker compose up -d --build db api frontend e2e

      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:3001 --timeout 120000

      - name: Show container logs on failure
        if: failure()
        working-directory: projects/blog
        run: docker compose logs

      - name: Install Playwright deps in e2e container
        working-directory: projects/blog
        run: |
          docker compose exec -T e2e npm install
          docker compose exec -T e2e npx playwright install

      - name: Run E2E tests
        working-directory: projects/blog
        run: docker compose exec -T e2e npx playwright test

      - name: Stop services
        if: always()
        working-directory: projects/blog
        run: docker compose down
