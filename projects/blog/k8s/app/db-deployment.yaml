# PostgreSQLを起動するDeployment。envFromでSecretの中身を丸ごと環境変数として注入している。
# volumeMountsでPVC(blog-postgres-pvc)をコンテナ内の実際のデータ保存先にマウントしている。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-postgres
  template:
    metadata:
      labels:
        app: blog-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: blog-postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: blog-postgres-pvc

