# projects/blog/k8s/app/db-secret.yaml
#
# DB接続用の機密情報。stringDataで書くと、Kubernetes側が自動でBase64エンコードして保存する。
# 本番(AWS)ではAWS Secrets Manager + EC2インスタンスプロファイル経由の取得に置き換える想定。
apiVersion: v1
kind: Secret
metadata:
  name: blog-postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: blog
  POSTGRES_PASSWORD: blog
  POSTGRES_DB: blog

