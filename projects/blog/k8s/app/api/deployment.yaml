apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-api
  template:
    metadata:
      labels:
        app: blog-api
    spec:
      containers:
        - name: api
          image: ghcr.io/ino8ban4/blog-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: blog-api-secret

